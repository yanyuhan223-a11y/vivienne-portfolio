<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — 液态金属散落字</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Noto Serif SC',Georgia,serif;
  background:radial-gradient(ellipse at 30% 20%,#fff5f0 0%,#f8ede3 40%,#f0e6d8 70%,#e8ddd0 100%);
}
body::before{
  content:'';position:fixed;inset:0;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;
}
.hero{position:relative;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.metal-wrap{position:relative;text-align:center;animation:floatBody 8s ease-in-out infinite}
@keyframes floatBody{0%,100%{transform:translateY(0) rotate(-0.3deg)}50%{transform:translateY(-14px) rotate(0.3deg)}}
.metal-text{
  width:min(86vw,900px);
  display:block;
  filter:drop-shadow(0 20px 50px rgba(0,0,0,0.15));
}
.metal-sub{
  margin-top:28px;font-size:clamp(12px,1.8vw,18px);font-weight:400;letter-spacing:8px;color:#a09080;opacity:0.8;
  animation:fadeUp 1.2s ease-out 0.5s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:0.8;transform:translateY(0)}}
.scroll-hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:3px;color:#b0a090;opacity:0.5;animation:fadeUp 1.5s ease-out 1s both}
@media(max-width:640px){
  .metal-text{width:94vw}
  .metal-sub{letter-spacing:4px;font-size:11px;margin-top:18px}
}
</style>
</head>
<body>
<div class="hero">
  <div class="metal-wrap">
    <img class="metal-text" src="assets/v4-metal-hero2.png" alt="VIVIENNE">
    <div class="metal-sub">颜于涵 / AI DESIGNER & ARTIST</div>
  </div>
  <div class="scroll-hint">SCROLL TO EXPLORE</div>
</div>
</body>
</html>
